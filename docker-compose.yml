services:
  app:
    build: .
    container_name: devops-app
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${GMAIL_ADDRESS}"
      GF_SMTP_PASSWORD: "${GMAIL_APP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GMAIL_ADDRESS}"
      GF_SMTP_FROM_NAME: "DevOps Monitoring"
      GF_SMTP_STARTTLS_POLICY: "Mandatory"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data: